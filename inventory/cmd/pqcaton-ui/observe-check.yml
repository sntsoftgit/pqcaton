# 관측 전 노드 점검. 서명 키를 만들기 전에 돈다(키는 아직 없다). 노드마다 접속 계정의 uid와, root가 아니면 `LC_ALL=C sudo -n -l`의
# 종료 코드와 출력을 컨트롤러로 가져온다. 판정은 화면(감독)이 한다(runkeys.go judgeChecks · sudocheck.go). 모든 노드가 통과해야 키를
# 만들고 관측을 시작한다. root로 접속하는 노드는 Ansible이 권한 상승을 건너뛰므로(같은 사용자, become_allow_same_user = False) 키가
# sudo를 거치지 않는다.
- name: pqcaton observation check
  hosts: targets
  gather_facts: false
  connection: ansible.builtin.ssh
  become: false
  tasks:
    - name: Read the account the node is reached with
      ansible.builtin.command:
        argv: [id, -u]
      register: account
      changed_when: false

    - name: Read the sudo policy of that account
      ansible.builtin.command:
        argv: [sudo, -n, -l]
      environment: { LC_ALL: C }
      register: policy
      changed_when: false
      failed_when: false
      when: account.stdout != '0'

    - name: Keep it for the check
      ansible.builtin.copy:
        content: "uid={{ account.stdout }}\n{{ policy.rc | default('') }}\n{{ policy.stdout | default('') }}\n{{ policy.stderr | default('') }}\n"
        dest: "{{ check_dir }}/{{ inventory_hostname }}.txt"
        mode: "0600"
      delegate_to: localhost
