# pqcaton-ui가 03 관측 화면에서 돌리는 플레이북. 바이너리에 담겨 나가고, 실행할 때마다 상태 폴더의 작업
# 자리에 풀어 쓴 뒤 지운다.
#
# 수집기는 pqcota-discovery가 내는 명령(pqcota-nodescan · pqcota-netcap · pqcota-jvmscan · pqcota-cngscan)이고,
# 여기서는 그 명령들이 문서로 밝힌 사용법대로 부른다. 수집기를 노드에 올리고, 실행하고, 결과를 컨트롤러로
# 가져오고, 노드에서 지운다. 지우는 일은 `always`에 있어 중간에 실패해도 한다.
#
# **노드 이름은 문법이 되지 않는다.** 인벤토리의 호스트 이름은 화면이 정한 별칭(n1, n2…)이고, 사람이 적은 노드 ID는
# pqcaton_node 변수로 온다(인벤토리에서 !unsafe라 템플릿으로 풀리지 않는다). 명령은 모두 argv로 불러 셸을 거치지
# 않고, 결과 파일 이름은 별칭으로 짓는다.
#
# 화면이 넘기는 변수(-e @vars.json):
#   results_dir    컨트롤러에서 결과를 받을 자리(작업 자리 안). 끝나면 화면이 작업 폴더의 results로 옮긴다
#   bin_root       수집기 폴더. linux-amd64 · linux-arm64 · windows-amd64 아래에 바이너리가 있다
#   jar_present    bin_root/collector.jar가 있는가. 없으면 JVM 관측을 건너뛴다
#   netcap_window  네트워크 관측 구간(초)
#   run_id         이번 실행의 ID. 노드의 스테이징 자리 이름에 붙는다
- name: pqcaton observation
  hosts: targets
  gather_facts: true
  vars:
    stage: "/tmp/pqcaton-observe-{{ run_id }}"
    stage_win: 'C:\Windows\Temp\pqcaton-observe-{{ run_id }}'
    arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"
    iface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
  tasks:
    - name: Linux node
      when: ansible_facts['os_family'] | default('') != 'Windows'
      become: true
      block:
        - name: Check the collectors for this node's architecture
          ansible.builtin.stat: { path: "{{ bin_root }}/linux-{{ arch }}/pqcota-nodescan" }
          register: bins
          delegate_to: localhost
          become: false

        - name: Stop here when there are no collectors for it
          ansible.builtin.fail: { msg: "no collectors for linux-{{ arch }} in the collector folder" }
          when: not bins.stat.exists

        - name: Make the staging directory
          ansible.builtin.file: { path: "{{ stage }}", state: directory, mode: "0700" }

        - name: Copy the collectors
          ansible.builtin.copy:
            src: "{{ bin_root }}/linux-{{ arch }}/{{ item }}"
            dest: "{{ stage }}/{{ item }}"
            mode: "0755"
          loop: [pqcota-nodescan, pqcota-netcap, pqcota-jvmscan]

        - name: Look for JVMs
          ansible.builtin.command:
            argv: ["{{ stage }}/pqcota-jvmscan", "-recon"]
          register: jvms
          changed_when: false
          when: jar_present | bool

        - name: Copy the JVM attach agent where a JVM runs
          ansible.builtin.copy: { src: "{{ bin_root }}/collector.jar", dest: "{{ stage }}/collector.jar", mode: "0644" }
          register: agent
          when: jar_present | bool and (jvms.stdout | default('[]') | from_json | length) > 0

        - name: Observe the OpenSSL runtime
          ansible.builtin.command:
            argv: ["{{ stage }}/pqcota-nodescan", "{{ pqcaton_node }}"]
          register: openssl
          changed_when: false

        - name: Keep the OpenSSL result
          ansible.builtin.copy: { content: "{{ openssl.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-openssl.json", mode: "0600" }
          delegate_to: localhost
          become: false

        - name: Observe the JCA provider chains
          ansible.builtin.command:
            argv: ["{{ stage }}/pqcota-jvmscan", "{{ pqcaton_node }}"]
          environment: { PQCOTA_JVM_AGENT: "{{ stage }}/collector.jar" }
          register: jca
          changed_when: false
          when: agent is not skipped and agent is succeeded

        - name: Keep the JCA result
          ansible.builtin.copy: { content: "{{ jca.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-jca.jsonl", mode: "0600" }
          delegate_to: localhost
          become: false
          when: jca is not skipped and (jca.stdout | default('') | length) > 0

        - name: Observe TLS and SSH handshakes
          ansible.builtin.command:
            argv: ["{{ stage }}/pqcota-netcap", "{{ pqcaton_node }}", "{{ iface }}", "{{ netcap_window }}"]
          register: net
          changed_when: false

        - name: Keep the network result
          ansible.builtin.copy: { content: "{{ net.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-net.json", mode: "0600" }
          delegate_to: localhost
          become: false
      always:
        - name: Remove the staging directory
          ansible.builtin.file: { path: "{{ stage }}", state: absent }

    - name: Windows node
      when: ansible_facts['os_family'] | default('') == 'Windows'
      block:
        - name: Make the staging directory
          ansible.windows.win_file: { path: "{{ stage_win }}", state: directory }

        - name: Copy the collectors
          ansible.windows.win_copy:
            src: "{{ bin_root }}/windows-amd64/{{ item }}"
            dest: '{{ stage_win }}\{{ item }}'
          loop: [pqcota-cngscan.exe, pqcota-jvmscan.exe]

        - name: Observe the CNG providers
          ansible.windows.win_command:
            argv: ['{{ stage_win }}\pqcota-cngscan.exe', "{{ pqcaton_node }}"]
          register: cng
          changed_when: false

        - name: Keep the CNG result
          ansible.builtin.copy: { content: "{{ cng.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-cng.json", mode: "0600" }
          delegate_to: localhost

        - name: Look for JVMs
          ansible.windows.win_command:
            argv: ['{{ stage_win }}\pqcota-jvmscan.exe', "-recon"]
          register: jvms_win
          changed_when: false
          when: jar_present | bool

        - name: Copy the JVM attach agent where a JVM runs
          ansible.windows.win_copy: { src: "{{ bin_root }}/collector.jar", dest: '{{ stage_win }}\collector.jar' }
          register: agent_win
          when: jar_present | bool and (jvms_win.stdout | default('[]') | from_json | length) > 0

        - name: Observe the JCA provider chains
          ansible.windows.win_command:
            argv: ['{{ stage_win }}\pqcota-jvmscan.exe', "{{ pqcaton_node }}"]
          environment: { PQCOTA_JVM_AGENT: '{{ stage_win }}\collector.jar' }
          register: jca_win
          changed_when: false
          when: agent_win is not skipped and agent_win is succeeded

        - name: Keep the JCA result
          ansible.builtin.copy: { content: "{{ jca_win.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-jca.jsonl", mode: "0600" }
          delegate_to: localhost
          when: jca_win is not skipped and (jca_win.stdout | default('') | length) > 0
      always:
        - name: Remove the staging directory
          ansible.windows.win_file: { path: "{{ stage_win }}", state: absent }
