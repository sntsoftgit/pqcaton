#
# pqcaton-ui가 03 관측 화면에서 돌리는 플레이북. 바이너리에 담겨 나가고, 실행할 때마다 상태 폴더의 작업
# 자리에 풀어 쓴 뒤 지운다.
#
# 수집기는 pqcota-discovery가 내는 명령(pqcota-nodescan · pqcota-netcap · pqcota-jvmscan)이고, 여기서는 그 명령들이 문서로 밝힌
# 사용법대로 부른다. 수집기를 노드에 올리고, 실행하고, 결과를 컨트롤러로 가져오고, 노드에서 지운다. 지우는 일은 `always`에
# 있어 중간에 실패해도 한다. 이번 판은 Linux 노드만 관측한다(Windows 노드는 화면이 실행 전에 막는다).
#
# **노드 이름은 문법이 되지 않는다.** 인벤토리의 호스트 이름은 화면이 정한 별칭(n1, n2…)이고, 사람이 적은 노드 ID는
# pqcaton_node 변수로 온다(인벤토리에서 !unsafe라 템플릿으로 풀리지 않는다). 명령은 모두 argv로 부르고, 결과 파일 이름은
# 별칭으로 짓는다.
#
# **서명 키는 노드 표준 입력으로만 간다.** 화면은 키 값을 이 플레이북에 넘기지 않는다. pqcaton_keys(수집기 ID → 컨트롤러의 임시
# 키 파일 경로)만 오고, 내장 조회 플러그인(ansible.builtin.file)이 읽어 모듈의 stdin으로 넘긴다. 노드에서는 짧은 래퍼(sign_wrapper)가
# 표준 입력 한 줄을 PQCOTA_SIGN_KEY로 내보내고 수집기를 exec한다. environment:로 넘기지 않는다(노드 명령줄에 실린다). 서명 작업은
# no_log이고, 뒤 작업은 그 결과의 stdout · stderr · rc만 쓴다. 결과 전체를 출력하거나 저장하지 않는다.
# 검증: pqcaton-aai reports/2026-11-18-v0.31.0-key-delivery-paths.md · reports/2026-11-18-v0.31.0-ansible-isolation.md
#
# 화면이 넘기는 변수(-e @vars.json, 그리고 관측에는 -e @run-keys.json):
#   results_dir    컨트롤러에서 결과를 받을 자리(작업 자리 안). 끝나면 화면이 작업 폴더의 results로 옮긴다
#   logs_dir       수집기의 표준 오류를 받을 자리(작업 자리 안)
#   bin_root       수집기 폴더. linux-amd64 · linux-arm64 아래에 바이너리가 있다
#   jar_present    bin_root/collector.jar가 있는가. 없으면 JVM 관측을 건너뛴다
#   netcap_window  네트워크 관측 구간(초)
#   run_id         이번 실행의 ID. 노드의 스테이징 자리 이름에 붙는다
#   pqcaton_keys   수집기 ID → 임시 서명 키 파일의 경로(run-keys.json)
- name: pqcaton observation
  hosts: targets
  gather_facts: true
  connection: ansible.builtin.ssh
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars:
    stage: "/tmp/pqcaton-observe-{{ run_id }}"
    arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"
    iface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
    sign_wrapper: 'IFS= read -r k; PQCOTA_SIGN_KEY=$k; export PQCOTA_SIGN_KEY; unset k; exec "$0" "$@"'
  tasks:
    - name: Linux node
      block:
        - name: Check the collectors for this node's architecture
          ansible.builtin.stat: { path: "{{ bin_root }}/linux-{{ arch }}/pqcota-nodescan" }
          register: bins
          delegate_to: localhost
          become: false

        - name: Stop here when there are no collectors for it
          ansible.builtin.fail: { msg: "no collectors for linux-{{ arch }} in the collector folder" }
          when: not bins.stat.exists

        - name: Make the staging directory
          ansible.builtin.file: { path: "{{ stage }}", state: directory, mode: "0700" }

        - name: Copy the collectors
          ansible.builtin.copy:
            src: "{{ bin_root }}/linux-{{ arch }}/{{ item }}"
            dest: "{{ stage }}/{{ item }}"
            mode: "0755"
          loop: [pqcota-nodescan, pqcota-netcap, pqcota-jvmscan]

        - name: Look for JVMs
          ansible.builtin.command:
            argv: ["{{ stage }}/pqcota-jvmscan", "-recon"]
          register: jvms
          changed_when: false
          when: jar_present | bool

        - name: Copy the JVM attach agent where a JVM runs
          ansible.builtin.copy: { src: "{{ bin_root }}/collector.jar", dest: "{{ stage }}/collector.jar", mode: "0644" }
          register: agent
          when: jar_present | bool and (jvms.stdout | default('[]') | from_json | length) > 0

        - name: Observe the OpenSSL runtime
          ansible.builtin.command:
            argv: ["/bin/sh", "-c", "{{ sign_wrapper }}", "{{ stage }}/pqcota-nodescan", "{{ pqcaton_node }}"]
            stdin: "{{ lookup('ansible.builtin.file', pqcaton_keys['openssl-collector']) }}"
          register: openssl
          changed_when: false
          failed_when: false
          no_log: true

        - name: Keep what the OpenSSL collector reported
          ansible.builtin.copy: { content: "{{ openssl.stderr }}", dest: "{{ logs_dir }}/{{ inventory_hostname }}-openssl.txt", mode: "0600" }
          delegate_to: localhost
          become: false

        - name: Stop when the OpenSSL collector failed
          ansible.builtin.fail: { msg: "pqcota-nodescan exited with {{ openssl.rc }}" }
          when: openssl.rc != 0

        - name: Keep the OpenSSL result
          ansible.builtin.copy: { content: "{{ openssl.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-openssl.json", mode: "0600" }
          delegate_to: localhost
          become: false

        - name: Observe the JCA provider chains
          ansible.builtin.command:
            argv: ["/bin/sh", "-c", "{{ sign_wrapper }}", "{{ stage }}/pqcota-jvmscan", "{{ pqcaton_node }}"]
            stdin: "{{ lookup('ansible.builtin.file', pqcaton_keys['jvm-collector']) }}"
          environment: { PQCOTA_JVM_AGENT: "{{ stage }}/collector.jar" }
          register: jca
          changed_when: false
          failed_when: false
          no_log: true
          when: agent is not skipped and agent is succeeded

        - name: Keep what the JCA collector reported
          ansible.builtin.copy: { content: "{{ jca.stderr }}", dest: "{{ logs_dir }}/{{ inventory_hostname }}-jca.txt", mode: "0600" }
          delegate_to: localhost
          become: false
          when: jca is not skipped

        - name: Stop when the JCA collector failed
          ansible.builtin.fail: { msg: "pqcota-jvmscan exited with {{ jca.rc }}" }
          when: jca is not skipped and jca.rc != 0

        - name: Keep the JCA result
          ansible.builtin.copy: { content: "{{ jca.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-jca.jsonl", mode: "0600" }
          delegate_to: localhost
          become: false
          when: jca is not skipped and (jca.stdout | default('') | length) > 0

        - name: Observe TLS and SSH handshakes
          ansible.builtin.command:
            argv: ["/bin/sh", "-c", "{{ sign_wrapper }}", "{{ stage }}/pqcota-netcap", "{{ pqcaton_node }}", "{{ iface }}", "{{ netcap_window }}"]
            stdin: "{{ lookup('ansible.builtin.file', pqcaton_keys['network-collector']) }}"
          register: net
          changed_when: false
          failed_when: false
          no_log: true

        - name: Keep what the network collector reported
          ansible.builtin.copy: { content: "{{ net.stderr }}", dest: "{{ logs_dir }}/{{ inventory_hostname }}-net.txt", mode: "0600" }
          delegate_to: localhost
          become: false

        - name: Stop when the network collector failed
          ansible.builtin.fail: { msg: "pqcota-netcap exited with {{ net.rc }}" }
          when: net.rc != 0

        - name: Keep the network result
          ansible.builtin.copy: { content: "{{ net.stdout }}", dest: "{{ results_dir }}/{{ inventory_hostname }}-net.json", mode: "0600" }
          delegate_to: localhost
          become: false
      always:
        - name: Remove the staging directory
          ansible.builtin.file: { path: "{{ stage }}", state: absent }
