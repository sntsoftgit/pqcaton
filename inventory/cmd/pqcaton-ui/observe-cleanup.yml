# 관측을 멈추거나 실패한 뒤 노드에 남은 스테이징 폴더를 지운다. 본 플레이북의 `always` 정리는 ansible-playbook이
# 끝내라는 신호를 받으면 돌지 않는다. 화면이 인벤토리를 지우기 전에 시간 제한을 두고 한 번 부른다. 서명 키는 노드에 파일로
# 두지 않으므로(표준 입력으로만 간다) 여기서 지울 키는 없다.
- name: pqcaton observation cleanup
  hosts: targets
  gather_facts: false
  connection: ansible.builtin.ssh
  vars:
    stage: "/tmp/pqcaton-observe-{{ run_id }}"
  tasks:
    - name: Remove the staging directory
      ansible.builtin.file: { path: "{{ stage }}", state: absent }
      become: true
      become_method: ansible.builtin.sudo
      become_user: root
