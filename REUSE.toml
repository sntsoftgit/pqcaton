# SPDX-FileCopyrightText: 2026 SNT Soft Co., Ltd.
# SPDX-License-Identifier: BUSL-1.1
#
# 머리말을 넣을 수 없는 파일(문서·설정·생성물·바이트로 견주는 샘플 등)의 저작권과 라이선스.
# precedence = "closest": 파일 안에 SPDX 머리말이 있으면 그것이 우선한다(기존 고지를 덮어쓰지 않는다).
#
# *_templ.go 는 make generate 가 다시 쓰므로 머리말을 넣지 않고 여기서 표기한다.
# LICENSES/BUSL-1.1.txt 는 LICENSE 와 바이트까지 같아야 한다. make check-licenses 가 견준다.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 SNT Soft Co., Ltd."
SPDX-License-Identifier = "BUSL-1.1"

# htmx 는 다른 저작자의 파일을 고치지 않고 함께 배포한다(AUTHORS, licenses.txt).
[[annotations]]
path = ["pkg/inventory/ui/static/htmx.min.js", "pkg/inventory/ui/static/LICENSE.htmx", "LICENSES/0BSD.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "The htmx authors"
SPDX-License-Identifier = "0BSD"
