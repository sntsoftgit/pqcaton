# 관문을 사람이 기억하지 않아도 걸리게 한다.
#
# 이 리포의 관문은 여럿인데(`Makefile`의 `all`이 목록이다) 전부 `make` 안에 있어,
# 돌리지 않고 보내면 아무도 못 잡았다. **여기에 수를 적지 않는다** — 관문이 하나 늘 때마다
# 이 주석이 낡는데, 그것을 알아채는 사람은 없다. 여기서 `make`를 그대로 돌린다 — **CI가 따로 아는 것을 두지
# 않는다.** 손에서 돌리는 것과 같은 명령이라야 「내 기계에서는 됐다」가 생기지 않는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 관문 전부 → 빌드 → 테스트. 무엇을 재는지는 `Makefile`에 적혀 있다.
      - run: make

      # 화면(`.templ`)을 고쳐 놓고 `make generate`를 안 돌린 날을 잡는다. `make`에 넣지
      # 않은 것은 이것만 망을 타기 때문이다 — CI는 망이 있으므로 여기서 본다.
      - run: make verify-generated

      # 모든 파일에 저작권과 라이선스가 적혀 있는지 본다(REUSE). Docker 와 망이 있어야 해서
      # `make`에 넣지 않았고, CI 에는 둘 다 있으므로 여기서 본다.
      - run: make check-reuse

  # Postgres 계약 시험(`make test-pg`). 이전 정책 복귀를 다시 허용하는 근거(IC-S26)는 실제 Postgres에서만 드러나므로, 여기서
  # 건너뛰지 않고 돌린다. 발행 관문(release-check)이 후보 커밋의 이 워크플로 성공을 요구하므로 IC-S26도 발행 관문의 일부다.
  # 서비스는 상류 데모와 같은 PostgreSQL 16이고, CI 전용 사용자 · 비밀번호 · DB를 쓰며 러너의 127.0.0.1에만 연다.
  postgres:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: pqcaton_ci
          # 비밀이 아니다: 이 공개 파일에 적힌 고정 시험값이고, 러너가 끝나면 사라지는 시험 DB에만 쓴다.
          POSTGRES_PASSWORD: not-secret-ci-only
          POSTGRES_DB: pqcaton_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pqcaton_ci -d pqcaton_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 서비스는 health check가 통과한 뒤에야 이 단계까지 온다. DSN은 이 단계에만 준다.
      - name: Postgres 계약 시험
        run: make test-pg
        env:
          PQCOTA_TEST_DSN: postgres://pqcaton_ci:not-secret-ci-only@127.0.0.1:5432/pqcaton_ci?sslmode=disable
