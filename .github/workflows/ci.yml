# 관문을 사람이 기억하지 않아도 걸리게 한다.
#
# 이 리포의 관문은 셋인데(라이선스 · 문구 · 서식) 전부 `make` 안에 있어, 돌리지 않고
# 보내면 아무도 못 잡았다. 여기서 `make` 를 그대로 돌린다 — **CI 가 따로 아는 것을 두지
# 않는다.** 손에서 돌리는 것과 같은 명령이라야 「내 기계에서는 됐다」가 생기지 않는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 라이선스 · 문구 · 서식 관문 → 빌드 → 테스트.
      - run: make

      # 화면(`.templ`)을 고쳐 놓고 `make generate` 를 안 돌린 날을 잡는다. `make` 에 넣지
      # 않은 것은 이것만 망을 타기 때문이다 — CI 는 망이 있으므로 여기서 본다.
      - run: make verify-generated
